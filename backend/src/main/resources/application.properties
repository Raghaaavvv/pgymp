spring.application.name=pgymp

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pgymp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:soma}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orbital26}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080
